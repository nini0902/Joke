<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測倒數 + 每日幹話</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card shadow-lg">
                    <div class="card-body text-center">
                        <h1 class="card-title mb-4">學測倒數計時</h1>
                        <div id="countdown" class="display-4 mb-4">
                            <div class="countdown-item">
                                <span id="days">000</span> 天
                                <span id="hours">00</span> 時
                                <span id="minutes">00</span> 分
                                <span id="seconds">00</span> 秒
                            </div>
                        </div>
                        <hr>
                        <div class="mt-4">
                            <h2>今日幹話</h2>
                            <div id="joke" class="mt-3 p-3 bg-light rounded">
                                載入中...
                            </div>
                            <button id="newJoke" class="btn btn-primary mt-3">換個幹話</button>
                        </div>
                        <hr>
                        <div class="mt-4">
                            <h2>崩潰日記</h2>
                            <div class="diary-container">
                                <div class="mood-selector mb-3">
                                    <label class="form-label">今天的心情等級：</label>
                                    <select id="moodLevel" class="form-select">
                                        <option value="1">😭 超級崩潰</option>
                                        <option value="2">😢 有點難過</option>
                                        <option value="3" selected>😐 還可以啦</option>
                                        <option value="4">😊 蠻開心的</option>
                                        <option value="5">🥳 超級開心</option>
                                    </select>
                                </div>
                                <div class="emoji-picker mb-2">
                                    <button type="button" class="btn btn-outline-secondary emoji-btn" data-emoji="💩">💩</button>
                                    <button type="button" class="btn btn-outline-secondary emoji-btn" data-emoji="📚">📚</button>
                                    <button type="button" class="btn btn-outline-secondary emoji-btn" data-emoji="✏️">✏️</button>
                                    <button type="button" class="btn btn-outline-secondary emoji-btn" data-emoji="💪">💪</button>
                                    <button type="button" class="btn btn-outline-secondary emoji-btn" data-emoji="🍜">🍜</button>
                                    <button type="button" class="btn btn-outline-secondary emoji-btn" data-emoji="☕">☕</button>
                                    <button type="button" class="btn btn-outline-secondary emoji-btn" data-emoji="😴">😴</button>
                                </div>
                                <textarea id="diaryText" class="form-control mb-3" rows="4" placeholder="今天又崩潰了嗎？寫下你的心情..."></textarea>
                                <div class="d-flex justify-content-between">
                                    <button id="saveDiary" class="btn btn-success">儲存日記</button>
                                    <button id="viewDiaries" class="btn btn-info">查看日記</button>
                                </div>
                                <div id="diaryList" class="mt-3 text-start d-none">
                                    <!-- 日記列表將在這裡顯示 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
